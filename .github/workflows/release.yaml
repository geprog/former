name: Release

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - '*'

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup git user
        run: |
          git config --global user.name "$(git --no-pager log --format=format:'%an' -n 1)"
          git config --global user.email "$(git --no-pager log --format=format:'%ae' -n 1)"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json

      - name: Cache pnpm modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: true

      - name: Build
        run: pnpm build

      - name: Set version @former-ui/former
        working-directory: packages/former/
        run: pnpm version ${GITHUB_REF#refs/*/} --no-commit-hooks --no-git-tag-version --no-git-checks
        if: 'github.ref_type == ''tag'''

      - name: Release @former-ui/former
        working-directory: packages/former/
        run: pnpm publish --no-git-checks --access public
        if: 'github.ref_type == ''tag'''

      - name: Set version @former-ui/preset-nuxt-ui
        working-directory: packages/preset-nuxt-ui/
        run: pnpm version ${GITHUB_REF#refs/*/} --no-commit-hooks --no-git-tag-version --no-git-checks
        if: 'github.ref_type == ''tag'''

      - name: Release @former-ui/preset-nuxt-ui
        working-directory: packages/preset-nuxt-ui/
        run: pnpm publish --no-git-checks --access public
        if: 'github.ref_type == ''tag'''

      - name: Set version @former-ui/formula
        working-directory: packages/formula/
        run: pnpm version ${GITHUB_REF#refs/*/} --no-commit-hooks --no-git-tag-version --no-git-checks
        if: 'github.ref_type == ''tag'''

      - name: Release @former-ui/formula
        working-directory: packages/formula/
        run: pnpm publish --no-git-checks --access public
        if: 'github.ref_type == ''tag'''

      - name: Set version @former-ui/formula-editor
        working-directory: packages/formula-editor/
        run: pnpm version ${GITHUB_REF#refs/*/} --no-commit-hooks --no-git-tag-version --no-git-checks
        if: 'github.ref_type == ''tag'''

      - name: Release @former-ui/formula-editor
        working-directory: packages/formula-editor/
        run: pnpm publish --no-git-checks --access public
        if: 'github.ref_type == ''tag'''

minimumReleaseAge: 1440
minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43830

peerDependencyRules:
  allowedVersions:
    '@former-ui/formula-editor>@former-ui/former': 0.0.0
    '@former-ui/formula-editor>@former-ui/formula': 0.0.0

    '@former-ui/formula>@former-ui/former': 0.0.0
    # the workspace packages are versioned 0.0.0, the real version is only set on release
    '@former-ui/preset-nuxt-ui>@former-ui/former': 0.0.0

strictPeerDependencies: true
shellEmulator: true

packages:
  - 'packages/*'
  - playground

allowBuilds:
  esbuild: false
  vue-demi: false
